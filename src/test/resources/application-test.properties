# Profile "test": DB H2 trong bộ nhớ, không cần MySQL. Ngân hàng giả lập.
spring.datasource.url=jdbc:h2:mem:bookstore_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.mail.host=
spring.mail.username=
spring.mail.password=
spring.jpa.properties.hibernate.format_sql=false

payment.qr.account-no=0123456789
payment.qr.account-name=BOOKSTORE TEST
payment.bank.history-url=
# Test tự gọi đối soát, không để lịch chạy nền xen vào
payment.bank.poll-interval-ms=3600000

# Captcha phía server tắt trong test để MockMvc gọi /api/auth/login trực tiếp
app.captcha.enabled=false
# Test dùng ngân hàng giả lập (/api/test/mock-bank)
app.mock-bank.enabled=true

# Khoá JWT và mật khẩu tài khoản mẫu chỉ dùng cho test
jwt.secret=test-only-jwt-secret-0123456789abcdef0123456789abcdef
app.seed.admin-password=admin123
app.seed.staff-password=staff123
app.seed.user-password=password123
