# Profile "test": DB H2 trong bộ nhớ, không cần MySQL. Ngân hàng giả lập.
spring.datasource.url=jdbc:h2:mem:bookstore_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

payment.bank.history-url=
# Test tự gọi đối soát, không để lịch chạy nền xen vào
payment.bank.poll-interval-ms=3600000
