# Database
spring.datasource.url=jdbc:mysql://localhost:3306/bookstore?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# XAMPP mac dinh root khong mat khau; may khac dat bien moi truong SPRING_DATASOURCE_PASSWORD
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=8080

# Dang nhap: access token (JWT) 15 phut; refresh token 30 ngay, tu gia han moi lan lam moi
jwt.expiration=900000
jwt.refresh-expiration-days=30
# Bat buoc dat bien moi truong JWT_SECRET (>= 32 ky tu ngau nhien), co gia tri mac dinh an toan cho local dev
jwt.secret=${JWT_SECRET}

# Mat khau tai khoan mau (chi dung khi DB trong). De trong = tu sinh ngau nhien va in ra log mot lan
app.seed.admin-password=${DEMO_ADMIN_PASSWORD:}
app.seed.staff-password=${DEMO_STAFF_PASSWORD:}
app.seed.user-password=${DEMO_CUSTOMER_PASSWORD:}

# Ngan hang gia lap (/api/test/mock-bank): mac dinh bat cho dev/test, co the tat qua bien moi truong MOCK_BANK_ENABLED=false
app.mock-bank.enabled=${MOCK_BANK_ENABLED:false}

# CORS: danh sach origin cach nhau dau phay. Token gui qua header nen khong can credentials
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Cau hinh email (khi can gui mail thuc te qua SMTP)
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${APP_MAIL_FROM:}
# Khong de health bao DOWN khi chua cau hinh SMTP
management.health.mail.enabled=false

# ============ THANH TOAN QR (VietQR + MB Bank) ============
payment.qr.bank-bin=970422
payment.qr.bank-name=MB Bank
# So tai khoan / ten chu tai khoan nhan tien: dat qua bien moi truong hoac dung mac dinh
payment.qr.account-no=${PAYMENT_QR_ACCOUNT_NO:}
payment.qr.account-name=${PAYMENT_QR_ACCOUNT_NAME:}
payment.qr.session-minutes=10
payment.qr.code-prefix=BK
# Link API lich su giao dich MB Bank: admin nhap tren web (Quan tri > Thanh Toan QR > Cai dat thanh toan), luu trong database.
# Dong duoi chi la gia tri du phong (bien moi truong BANK_HISTORY_URL) khi admin chua nhap. De trong = khong doi soat (chi dung ngan hang gia lap neu app.mock-bank.enabled=true).
payment.bank.history-url=${BANK_HISTORY_URL:}
payment.bank.poll-interval-ms=5000

# ============ CAU HINH TINH PHI SHIP GOOGLE MAPS (2 KHO HN & HCM) ============
shipping.google.api-key=${GOOGLE_MAPS_API_KEY:}
shipping.warehouse.hn.address=144 Xuan Thuy, Dich Vong Hau, Cau Giay, Ha Noi
shipping.warehouse.hn.coords=21.0368,105.7821

shipping.warehouse.hcm.address=Duong Han Thuyen, Khu pho 6, Linh Trung, Thu Duc, TP. Ho Chi Minh
shipping.warehouse.hcm.coords=10.8700,106.8031

shipping.free-threshold=300000
shipping.free-max-subsidy=30000

# ============ ACTUATOR & PROMETHEUS (Giám sát JVM / Metric) ============
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=when_authorized
