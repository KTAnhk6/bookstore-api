# Database
spring.datasource.url=jdbc:mysql://localhost:3306/bookstore?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# XAMPP mac dinh root khong mat khau; may khac dat bien moi truong SPRING_DATASOURCE_PASSWORD
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Kieu3110}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=8080

# Dang nhap: access token (JWT) 15 phut; refresh token 30 ngay, tu gia han moi lan lam moi
jwt.expiration=900000
jwt.refresh-expiration-days=30

# Cau hinh email (khi can gui mail thuc te qua SMTP)
spring.mail.host=
spring.mail.username=
app.mail.from=

# ============ THANH TOAN QR (VietQR + MB Bank) ============
payment.qr.bank-bin=970422
payment.qr.bank-name=MB Bank
payment.qr.account-no=0396902081
payment.qr.account-name=NGUYEN KIEU TUAN ANH
payment.qr.session-minutes=10
payment.qr.code-prefix=BK
# Link API lich su giao dich MB Bank: admin nhap tren web (Quan tri > Thanh Toan QR > Cai dat thanh toan), luu trong database.
# Dong duoi chi la gia tri du phong (bien moi truong BANK_HISTORY_URL) khi admin chua nhap. De trong = ngan hang gia lap.
payment.bank.history-url=${BANK_HISTORY_URL:}
payment.bank.poll-interval-ms=5000
