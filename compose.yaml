services:
  api:
    build: .
    image: bookstore-api
    container_name: bookstore-api
    ports:
      - "8085:8080"
    restart: unless-stopped
    networks:
      - nat
    volumes:
      - type: bind
        source: C:\BookNestData\uploads
        target: C:\app\uploads
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://172.23.176.1:3306/bookstore?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: bookstore_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PAYMENT_QR_ACCOUNT_NO: ${PAYMENT_QR_ACCOUNT_NO}
      PAYMENT_QR_ACCOUNT_NAME: ${PAYMENT_QR_ACCOUNT_NAME}

networks:
  nat:
    external: true
